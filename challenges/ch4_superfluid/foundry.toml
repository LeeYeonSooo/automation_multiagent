[rpc_endpoints]
ch4 = "${RPC_CH4_SUPERFLUID}"
# Chain-name alias for convenience matching reference/IDAUsage_t.sol style:
polygon = "${RPC_CH4_SUPERFLUID}"

[fmt]
line_length = 120
tab_width = 4

[fuzz]
runs = 32
