# Foundry config for ch4_superfluid
# Generated from templates/foundry.toml.template (2026-04-18)

[profile.default]
src = "exploit"
test = "poc"
out = "out"
cache_path = "cache"
solc_version = "0.8.23"
optimizer = true
optimizer_runs = 200
via_ir = false
fs_permissions = [{ access = "read-write", path = "./" }]
