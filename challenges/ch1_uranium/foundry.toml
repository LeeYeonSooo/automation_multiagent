# Foundry config for ch1_uranium
# Generated from templates/foundry.toml.template (2026-04-18)

[profile.default]
src = "exploit"
test = "poc"
out = "out"
cache_path = "cache"
solc_version = "0.8.23"
optimizer = true
optimizer_runs = 200
via_ir = false
fs_permissions = [{ access = "read-write", path = "./" }]
# TODO: pin after recon (BSC fork)

[rpc_endpoints]
ch1 = "${RPC_CH1_URANIUM}"
# Chain-name alias for convenience matching reference/IDAUsage_t.sol style:
bsc = "${RPC_CH1_URANIUM}"

[fmt]
line_length = 120
tab_width = 4

[fuzz]
runs = 32
